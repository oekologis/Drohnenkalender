name: Supabase Keep-Alive

on:
  schedule:
    # Läuft jeden Montag um 06:00 UTC (alle 7 Tage, rechtzeitig vor dem Pause-Limit)
    - cron: '0 6 * * 1'
  workflow_dispatch: # erlaubt manuelles Auslösen zum Testen

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Data API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
